name: Trade Radar checks
on:
  pull_request:
    paths: ['server/trades/**', 'src/data/teams.js', '.github/workflows/trade-radar.yml']
  push:
    paths: ['server/trades/**', 'src/data/teams.js', '.github/workflows/trade-radar.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/trades/package-lock.json
      - run: npm ci --prefix server/trades
      - run: npm test --prefix server/trades
